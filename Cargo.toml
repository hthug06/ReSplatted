[workspace]
members = [
    "resplatted",
    "resplatted-protocol"
]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
authors = ["ht06"]

[workspace.dependencies]
# Internal crates
resplatted-protocol = { path = "resplatted-protocol" }

# External dependencies
tokio = { version = "1.52.3", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "signal", "time"] }

# log
log = "0.4.29"
simplelog = "0.12.2"
bytes = "1.11.1"

# textcomponent, to read packet
text_components = { git = "https://github.com/Steel-Foundation/TextComponents.git", features = ["serde"]}

rand = "0.10.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'